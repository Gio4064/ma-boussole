name: Vérif liens RDV
on:
  schedule: [{cron: '41 4 6 * *'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_rdv.py
      - run: |
          git config user.name "Ma Boussole"; git config user.email "noreply@anthropic.com"
          git add rdv_links.json
          git diff --cached --quiet || (git commit -m "Liens RDV : vérification mensuelle" && git push)
