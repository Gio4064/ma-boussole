name: donnees-aide
# Reconstruit chaque mois les annuaires (RPPS, FINESS, avocats) utilisés par « Trouver de l'aide »
# et les publie sur la branche « data » (sans historique, pour ne pas alourdir le dépôt).
on:
  schedule:
    - cron: '17 3 4 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/build_data.py', '.github/workflows/data.yml']
permissions:
  contents: write
concurrency:
  group: donnees-aide
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyproj
      - name: Construire les données
        env:
          WORK: ${{ runner.temp }}/work
        run: python scripts/build_data.py out
      - name: Publier sur la branche data
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Données d'aide du $(date +%F) (RPPS, FINESS, avocats)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
